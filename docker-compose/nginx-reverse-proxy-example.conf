# =========================================================
# GLKVM Cloud - Reverse Proxy Mode (Nginx Example)
#
# This configuration shows how to run GLKVM Cloud behind
# Nginx in reverse proxy mode.
#
# - TLS is terminated by Nginx
# - GLKVM Cloud listens on plain HTTP internally
# - Web UI and remote device access share the same HTTPS port
# - Devices are told apart by their own domain name, or by path
# =========================================================

# WebSocket connection helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Web UI: https://www.example.com ---
# Devices are opened on their own subdomain by default, served by the
# *.example.com block below. To open them by path under this domain,
# set X-KVM-Access-Style to "path" in "location /": one certificate
# and one DNS record are then enough for devices that joined with an
# access code. Devices on older firmware keep their own host, so keep the
# *.example.com block while you have them.
server {
    listen 443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Device access by path: strip /access/<device_id> so the device sees
    # its own paths, and name the device in X-KVM-Access-ID.
    # proxy_set_header replaces whatever the browser sent. The platform
    # only sends devices here when X-KVM-Access-Style below is "path".
    location ~ ^/access/([a-z0-9]+)($|/) {
        set $access_id $1;

        proxy_http_version 1.1;

        proxy_set_header X-KVM-Access-ID     $access_id;

        proxy_set_header Host                $host;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Port    $server_port;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;

        # WebSocket support
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;

        # Large uploads (virtual media images): stream them to the device
        # instead of rejecting (413) or buffering them first
        client_max_body_size 8g;
        proxy_request_buffering off;
        proxy_buffering off;

        rewrite ^/access/[a-z0-9]+(/.*)?$ $1 break;

        # GLKVM Cloud device access service (HTTP)
        proxy_pass http://127.0.0.1:10443;

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_http_version 1.1;

        # How the platform opens devices: "" for their own subdomain
        # (https://<device_id>.example.com), "path" for
        # https://www.example.com/access/<device_id>/
        proxy_set_header X-KVM-Access-Style  "";

        proxy_set_header Host                $host;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Port    $server_port;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;

        # WebSocket support
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;

        # GLKVM Cloud web service (HTTP)
        proxy_pass http://127.0.0.1:1443;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --- Device Access: https://<device_id>.example.com ---
server {
    listen 443 ssl http2;
    server_name *.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_http_version 1.1;

        # Required forwarded headers for reverse proxy mode
        proxy_set_header Host                $host;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Port    $server_port;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;

        # WebSocket support
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;

        # Large uploads (virtual media images): stream them to the device
        # instead of rejecting (413) or buffering them first
        client_max_body_size 8g;
        proxy_request_buffering off;
        proxy_buffering off;

        # GLKVM Cloud device access service (HTTP)
        proxy_pass http://127.0.0.1:10443;

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
